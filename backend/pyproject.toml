[project]
name = "cc2"
version = "0.1.0"
description = "Logistics Simulation & Data Layer — AI-powered logistics monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.11",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "simpy>=4.1.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.4.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
