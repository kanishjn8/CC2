services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64   # runs under Rosetta 2 on Apple Silicon
    container_name: cc2-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cc2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # schema.sql mount removed — main.py lifespan handles CREATE EXTENSION
      # + SQLAlchemy create_all on every startup, so no init-script needed.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cc2_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI app ───────────────────────────────────────────────────────────
  api:
    image: python:3.12-slim
    container_name: cc2-api
    restart: always
    working_dir: /app
    # Install uv, sync deps, then launch uvicorn — all in one shot so the
    # image stays ephemeral and no pre-built image is required.
    # PORT env var is injected by Railway; defaults to 8000 for local compose.
    command: >
      bash -c "
        pip install uv --quiet &&
        uv sync --no-dev &&
        uv run uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
      "
    volumes:
      - .:/app          # mount the entire backend folder
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cc2_db
      SIM_TICK_INTERVAL: "2.0"
      SIM_SPEED: "10.0"
      SEED_WAREHOUSES: "10"
      SEED_CARRIERS: "12"
      SEED_ROUTES: "30"
      SEED_SHIPMENTS: "60"
      AGENT_TICK_INTERVAL: "60.0"
      RISK_THRESHOLD: "0.6"
      BOTTLENECK_THRESHOLD: "0.85"
      CARRIER_RELIABILITY_THRESHOLD: "0.5"
      LLM_CALL_COOLDOWN: "30.0"
      ALERT_EMAIL_COOLDOWN: "300"
      LIFECYCLE_TICK_INTERVAL: "10.0"
      LIFECYCLE_GRACE_PERIOD: "20.0"
      LIFECYCLE_TARGET_ACTIVE: "60"
      # ── Secrets: set these in a .env file or Railway dashboard ──────────
      # GEMINI_API_KEY: set_in_env_or_dashboard
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: 587
      # SMTP_USER: your_email@gmail.com
      # SMTP_PASSWORD: your_app_password
      # SMTP_USE_TLS: "true"
      # ALERT_EMAIL_FROM: alerts@routesense.ai
      # ALERT_EMAIL_TO: operator@example.com
      # ALLOWED_ORIGINS: https://your-frontend.vercel.app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: