services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64   # runs under Rosetta 2 on Apple Silicon
    container_name: cc2-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cc2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # schema.sql mount removed — main.py lifespan handles CREATE EXTENSION
      # + SQLAlchemy create_all on every startup, so no init-script needed.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cc2_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI app ───────────────────────────────────────────────────────────
  api:
    image: python:3.12-slim
    container_name: cc2-api
    restart: always
    working_dir: /app
    # Install uv, sync deps, then launch uvicorn — all in one shot so the
    # image stays ephemeral and no pre-built image is required.
    command: >
      bash -c "
        pip install uv --quiet &&
        uv sync --no-dev &&
        uv run uvicorn main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - .:/app          # mount the entire backend folder
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cc2_db
      SIM_TICK_INTERVAL: "2.0"
      SIM_SPEED: "10.0"
      SEED_WAREHOUSES: "5"
      SEED_CARRIERS: "8"
      SEED_ROUTES: "12"
      SEED_SHIPMENTS: "20"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: