services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: cc2-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cc2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # schema.sql is executed automatically on first container start
      # (only when the data volume is empty / database is brand-new).
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cc2_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI app ───────────────────────────────────────────────────────────
  api:
    image: python:3.12-slim
    container_name: cc2-api
    restart: always
    working_dir: /app
    # Install uv, sync deps, then launch uvicorn — all in one shot so the
    # image stays ephemeral and no pre-built image is required.
    command: >
      bash -c "
        pip install uv --quiet &&
        uv sync --no-dev &&
        uv run uvicorn main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - .:/app          # mount the entire backend folder
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cc2_db
      SIM_TICK_INTERVAL: "2.0"
      SIM_SPEED: "10.0"
      SEED_WAREHOUSES: "5"
      SEED_CARRIERS: "8"
      SEED_ROUTES: "12"
      SEED_SHIPMENTS: "20"
      AGENT_TICK_INTERVAL: "10.0"
      RISK_THRESHOLD: "0.6"
      BOTTLENECK_THRESHOLD: "0.85"
      CARRIER_RELIABILITY_THRESHOLD: "0.5"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_PRIMARY_MODEL: "gemini-3.1-flash"
      GEMINI_FALLBACK_MODEL: "gemini-3.1-flash-lite"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: